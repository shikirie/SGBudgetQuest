<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Analytics Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f4f9; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; }
        h1 { text-align: center; color: #333; }
        
        /* Kartu Statistik */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; }
        .card h3 { margin: 0; color: #777; font-size: 14px; text-transform: uppercase; }
        .card p { margin: 10px 0 0; font-size: 32px; font-weight: bold; color: #2c3e50; }
        
        /* Grafik & Tabel */
        .charts-container { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .chart-box { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: #2c3e50; color: white; }
        tr:hover { background-color: #f1f1f1; }
        .status-win { color: green; font-weight: bold; }
        .status-lose { color: red; font-weight: bold; }
        .status-bankrupt { color: darkred; font-weight: bold; }

        .loading { text-align: center; margin-top: 50px; font-size: 18px; color: #666; }
    </style>
</head>
<body>

<div class="container">
    <h1>🎮 SG Budget Quest Metrics</h1>
    
    <div id="loading" class="loading">Fetching data from AWS...</div>

    <div id="dashboard" style="display: none;">
        <div class="stats-grid">
            <div class="card">
                <h3>Total Sessions</h3>
                <p id="totalSessions">0</p>
            </div>
            <div class="card">
                <h3>Win Rate</h3>
                <p id="winRate">0%</p>
            </div>
            <div class="card">
                <h3>Avg. Happiness</h3>
                <p id="avgHappiness">0</p>
            </div>
            <div class="card">
                <h3>Avg. Savings</h3>
                <p id="avgSavings">S$0</p>
            </div>
        </div>

        <div class="charts-container">
            <div class="chart-box">
                <canvas id="leakChart"></canvas>
            </div>
            <div class="chart-box">
                <canvas id="statusChart"></canvas>
            </div>
        </div>

        <h3 style="margin-top: 40px;">Recent Sessions</h3>
        <table id="dataTable">
            <thead>
                <tr>
                    <th>Time</th>
                    <th>Status</th>
                    <th>Leak Category</th>
                    <th>Savings</th>
                    <th>Day Survived</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
</div>

<script>
    // --- GANTI URL INI DENGAN API GATEWAY LAMBDA KAMU ---
    const API_URL = "https://w7m5yahcs7.execute-api.ap-southeast-1.amazonaws.com/default/SaveGameData"; 

    async function fetchData() {
        try {
            const response = await fetch(API_URL);
            const result = await response.json();
            
            // AWS Lambda kamu mereturn object: { message, count, data: [...] }
            // Jadi kita ambil result.data
            const sessions = result.data; 

            processData(sessions);
        } catch (error) {
            console.error("Error fetching data:", error);
            document.getElementById('loading').innerText = "Failed to load data. Check Console.";
        }
    }

    function processData(data) {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('dashboard').style.display = 'block';

        // 1. Hitung Statistik Dasar
        const total = data.length;
        const wins = data.filter(d => d.isWin === true).length;
        const totalHappiness = data.reduce((acc, d) => acc + (d.currentHappiness || 0), 0);
        const totalSavings = data.reduce((acc, d) => acc + (d.currentSavings || 0), 0);

        document.getElementById('totalSessions').innerText = total;
        document.getElementById('winRate').innerText = total > 0 ? ((wins / total) * 100).toFixed(1) + "%" : "0%";
        document.getElementById('avgHappiness').innerText = total > 0 ? Math.round(totalHappiness / total) : 0;
        document.getElementById('avgSavings').innerText = total > 0 ? "S$" + (totalSavings / total).toFixed(2) : "S$0";

        // 2. Siapkan Data Grafik (Pie Chart: Leak Category)
        const leaks = {};
        data.forEach(d => {
            const cat = d.expenseLeakCategory || "None";
            leaks[cat] = (leaks[cat] || 0) + 1;
        });

        new Chart(document.getElementById('leakChart'), {
            type: 'doughnut',
            data: {
                labels: Object.keys(leaks),
                datasets: [{
                    data: Object.values(leaks),
                    backgroundColor: ['#FF6384', '#36A2EB', '#FFCE56', '#4BC0C0', '#9966FF'],
                }]
            },
            options: {
                plugins: { title: { display: true, text: 'Biggest Expense Leak Categories' } }
            }
        });

        // 3. Siapkan Data Grafik (Bar Chart: Session Status)
        const statuses = {};
        data.forEach(d => {
            const stat = d.sessionStatus || "Unknown";
            statuses[stat] = (statuses[stat] || 0) + 1;
        });

        new Chart(document.getElementById('statusChart'), {
            type: 'bar',
            data: {
                labels: Object.keys(statuses),
                datasets: [{
                    label: 'Count',
                    data: Object.values(statuses),
                    backgroundColor: '#36A2EB'
                }]
            },
            options: {
                plugins: { title: { display: true, text: 'Session Status Distribution' } },
                scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } }
            }
        });

        // 4. Isi Tabel (5 Data Terakhir)
        // Sort by timestamp descending (terbaru di atas)
        const sortedData = data.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp)).slice(0, 5);
        const tbody = document.querySelector("#dataTable tbody");
        
        sortedData.forEach(d => {
            const date = new Date(d.timestamp).toLocaleString();
            let statusColor = d.isWin ? "status-win" : "status-lose";
            if (d.sessionStatus === "Bankrupt") statusColor = "status-bankrupt";

            const row = `
                <tr>
                    <td>${date}</td>
                    <td class="${statusColor}">${d.sessionStatus}</td>
                    <td>${d.expenseLeakCategory}</td>
                    <td>S$${d.currentSavings}</td>
                    <td>${d.daySurvived}</td>
                </tr>
            `;
            tbody.innerHTML += row;
        });
    }

    // Jalankan saat load
    fetchData();
</script>

</body>
</html>
